<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>LMTTEST running</title>
<style>
  body { font: 13px/1.6 Consolas, monospace; margin: 0; background: #fff; }
  #report { margin: 0; padding: 8px 12px; white-space: pre-wrap; }
  iframe { border: 0; display: block; }
  #frames { position: fixed; left: -4000px; top: 0; }
</style>
</head>
<body>
<!-- 两个应用都放在 iframe 里真实渲染；测试通过事件派发模拟点击，断言可见反馈。
     入口可用 ?layout=&cardgen= 切换：默认跑 docs/ 下的 PWA 副本，
     也可指向 android/<app>/src/main/assets/index.html 的安卓副本。
     两份的「共享核心」由 tools/web-sync.ps1 -Check 守卫逐字一致，
     但 @shell: 标记包住的两端外壳（PWA 的 pwa-head / pwa-sw、安卓的 android-save / template 等）
     不在这层保障里，因此必须各自实测一遍。 -->
<div id="frames">
  <iframe id="frame-layout" width="375" height="667" style="width:375px;height:667px"></iframe>
  <iframe id="frame-cardgen" width="1024" height="900" style="width:1024px;height:900px"></iframe>
</div>
<pre id="report">测试运行中…</pre>
<script>
  (function () {
    var p = new URLSearchParams(location.search);
    var layout = p.get('layout') || '../docs/lmt-layout/index.html';
    var cardgen = p.get('cardgen') || '../docs/lmt-cardgen/index.html';
    document.getElementById('frame-layout').setAttribute('src', layout);
    document.getElementById('frame-cardgen').setAttribute('src', cardgen);
    // 供报告头显示本次实际跑的是哪一份副本
    window.__entry = { layout: layout, cardgen: cardgen };
  })();
</script>
<script src="./harness.js"></script>

</body>
</html>
