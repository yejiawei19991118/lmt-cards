name: web-check

# CI 侧两道守卫：
#   1. sw-hash   —— 校验每个 docs/<app>/sw.js 里的 @index-hash 是否与该 app 的 index.html 归一化内容一致。
#                   不一致 = 改了 index.html 却忘了升 SW 缓存版本（用户会一直看到旧界面）。
#   2. web-tests —— 用无头 Chromium 真实加载 tests/harness.html，把两个应用放进 iframe 里跑交互用例，
#                   守住「点击无反应 / 反馈缺失 / 模板切换失效 / 导出台账往返损坏」这类回归。
# 本地可用 tools/web-sync.ps1 -Bump 一键升版并写回 @index-hash；
# 同时用 tools/web-sync.ps1 -Check 校验 PWA 与 Android 副本的共享核心是否一致（需本地工作区）；
# 交互用例本地跑：pwsh -File tests/run.ps1（会自动探测 Edge / Chrome / Chromium）。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  sw-hash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 校验 sw.js 的 @index-hash 与 index.html 一致
        run: |
          set -eu
          fail=0
          for dir in docs/*/; do
            app=$(basename "$dir")
            idx="${dir}index.html"
            sw="${dir}sw.js"
            [ -f "$idx" ] || continue
            if [ ! -f "$sw" ]; then
              echo "::error file=$idx::$app 缺少 sw.js"
              fail=1
              continue
            fi
            # 归一化：裁掉每行行尾空白、丢弃空行、以 LF 连接、去掉末尾换行（与 tools/web-sync.ps1 保持一致）
            text=$(awk '{ sub(/[ \t\r]+$/,""); if ($0 != "") printf "%s\n", $0 }' "$idx")
            h=$(printf '%s' "$text" | sha256sum | cut -c1-8)
            m=$(sed -n 's/.*@index-hash: *\([0-9a-f]\{8\}\).*/\1/p' "$sw" | head -n1)
            if [ "$h" != "$m" ]; then
              echo "::error file=$sw::$app 的 @index-hash（$m）与 index.html 实际哈希（$h）不一致：已在本地运行 tools/web-sync.ps1 -Bump 并提交 sw.js？"
              fail=1
            else
              echo "$app OK：$h"
            fi
          done
          exit $fail

  web-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 无头 Chromium 跑交互测试
        # 运行器自带 google-chrome，也自带 pwsh；run.ps1 会按 CHROME_PATH → 常见安装路径 → PATH 依次探测。
        # 用例全部离线运行（--host-resolver-rules 强制断网），因此不依赖任何线上资源。
        run: pwsh -NoProfile -File tests/run.ps1
