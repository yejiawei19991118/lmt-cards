name: auto-release

# 端到端自动同步上线：PWA 侧（lmt-cards）的共享核心一变，就自动搬运进安卓源码 → 自动构建正式签名 APK
# → 自动发布 Release 与更新清单 → 自动 push 回两个仓库 → 自动刷新并逐源校验 CDN 缓存。
#
# 触发：main 分支收到 push（即「PWA 端任何变化」）。
# 门控分两条路径：
#   · 共享核心真的变了 → 走完整发版（同步安卓副本 → 构建 APK → Release → 更新清单 → 推送）。
#     判定方式是观察 -Sync 之后安卓工作区是否有改动——它由同步基线（android/lmt-cards-sync.json）
#     驱动，是「共享核心变没变」的唯一事实源，不在 YAML 里重复实现一遍哈希逻辑。
#   · 只改了 PWA 专属外壳（@shell:pwa-* 片段、PWA head meta 等）→ 不进安卓、也不发版，但必须先跑
#     tools/web-sync.ps1 -Bump 升 sw.js 的缓存版本、更新 @index-hash 并提交，否则已装 PWA
#     （尤其 iOS 主屏 App）会一直命中旧预缓存，用户「刷新也看不到新界面」，CI 的 sw-hash 校验也会报红。
#     故这里在门控之前无条件跑一次 -Bump（幂等：仅在 index.html 归一化内容变化时才升版），
#     再按「安卓是否有改动」决定走发版还是仅提交 sw.js。
#
# 顺序上刻意把「推送安卓副本」放在发版之后：若构建或发布失败，安卓工作区仍是脏的，
# 重跑时会重新识别为「待同步」并重试发版，不会出现「源码已同步、APK 却没发出去」的空档。
#
# 人工逃生通道仍在 .github/workflows/release.yml：打 tag apk-v* 可用同一套脚本手动发版（两者共用一个
# concurrency 组，避免并发发版算出同一个 versionCode 把更新清单写乱）。

on:
  push:
    branches: [main]
  workflow_dispatch:

# 与 release.yml 共用同一个组：同一时刻只允许一次发版在跑。
concurrency:
  group: release
  cancel-in-progress: false

# 需要写权限：创建 Release、上传资产、把 update.json 推回本仓库。
permissions:
  contents: write

jobs:
  sync-and-release:
    runs-on: ubuntu-latest
    # 本工作流自己 push 的 chore(release) 提交会再次触发 main 的 push：
    # 那种情况下共享核心必然没变，直接跳过整个作业，省下一次空跑。
    if: >-
      github.event_name == 'workflow_dispatch' ||
      !startsWith(github.event.head_commit.message, 'chore(release):')
    steps:
      # 两个 checkout 必须同级：tools/web-sync.ps1 与 tools/release.ps1 靠「同级 android/ + lmt-cards/」定位工作区根目录。
      - name: 检出 lmt-cards（PWA 源码、清单与发版脚本）
        uses: actions/checkout@v4
        with:
          ref: main
          path: lmt-cards
          fetch-depth: 0

      # 安卓工程在私有仓库：用部署密钥检出。自动同步要能 push 回去，故该密钥必须勾选 Allow write access。
      - name: 检出 android（私有工程，部署密钥）
        uses: actions/checkout@v4
        with:
          repository: yejiawei19991118/lmt-android
          ssh-key: ${{ secrets.LMT_ANDROID_DEPLOY_KEY }}
          path: android
          fetch-depth: 0

      - name: 准备 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 把 PWA 的共享核心同步进安卓副本
        # -Sync 会先校验 @shell 结构，再比对同步基线：
        #   · 安卓侧被单方面改动过 → 报错退出，绝不静默覆盖；
        #   · 只是 PWA 侧更新了 → 按块名原位替换，重写安卓的 index.html 并更新基线。
        run: pwsh -NoProfile -File lmt-cards/tools/web-sync.ps1 -Sync

      - name: 依据 index.html 变化升 SW 缓存版本
        # 放在门控之前、且无条件执行：-Bump 是幂等的（只有 docs/<app>/index.html 的归一化内容变了才升版），
        # 这样「只改了 PWA 专属外壳、不进安卓」的改动也能被升版，避免用户长期停在旧界面。
        run: pwsh -NoProfile -File lmt-cards/tools/web-sync.ps1 -Bump

      - name: 判断共享核心是否变化
        id: gate
        run: |
          set -euo pipefail
          changed=$(git -C android status --porcelain)
          docs_changed=$(git -C lmt-cards status --porcelain -- docs)
          if [ -z "$changed" ]; then
            echo "共享核心未变化：本次推送只动了 PWA 专属外壳（sw.js 缓存版本 / head meta 等），安卓副本无需更新。"
          else
            echo "共享核心已变化，将同步并发布新 APK："
            echo "$changed"
          fi
          if [ -n "$docs_changed" ]; then
            echo "PWA 侧（docs/）有改动，需随本次一并提交："
            echo "$docs_changed"
          fi
          [ -n "$changed" ] && echo "changed=true" >> "$GITHUB_OUTPUT" || echo "changed=false" >> "$GITHUB_OUTPUT"
          [ -n "$docs_changed" ] && echo "docs_changed=true" >> "$GITHUB_OUTPUT" || echo "docs_changed=false" >> "$GITHUB_OUTPUT"

      - name: 无头 Chromium 跑交互测试（安卓 assets 副本）
        if: steps.gate.outputs.changed == 'true'
        working-directory: lmt-cards
        # 用与 web-check 完全相同的一套用例、只换 iframe 入口，因此 @shell 包住的安卓外壳（原生落盘桥）也真的被跑到。
        run: >-
          pwsh -NoProfile -File tests/run.ps1
          -LayoutTarget ../../android/lmt-layout/src/main/assets/index.html
          -CardgenTarget ../../android/lmt-cardgen/src/main/assets/index.html

      - name: 还原 release 签名
        if: steps.gate.outputs.changed == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.LMT_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.LMT_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.LMT_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | base64 -d > android/lmt-release.jks
          {
            echo "storeFile=lmt-release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=lmt"
            echo "keyPassword=$KEY_PASSWORD"
            echo "storeType=PKCS12"
          } > android/keystore.properties

      - name: 构建并发布 APK（升版本号 → 构建 → Release → 更新清单 → push → 刷新 CDN）
        if: steps.gate.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          # 版本号由 release.ps1 以 update.json 的 versionCode +1 推算，无需人工指定；
          # 构建后它会把新版本回写 android/version.properties，并在下面随安卓副本一并提交。
          # -WithTests 让单测与 assembleRelease 并入同一次 Gradle 调用，省一次冷启动。
          pwsh lmt-cards/tools/release.ps1 -WithTests \
            -Notes "自动发版：共享核心随 lmt-cards ${GITHUB_SHA:0:8} 更新"

      - name: 独立复核发版产物与登记值
        # release.ps1 内部已有产物断言；这里再做一次「不信任脚本内存状态」的复核：直接用命令行工具重算
        # 镜像 APK 的 sha256/大小、比对 update.json 登记值与 version.properties，最后通过 API 取 Release
        # 资产的字节数——覆盖「本地算对了，但镜像没更新 / 资产没传上去 / 回写漏了一处」这类断链。
        # 放在推送安卓副本之前：仅当产物确实一致时，才允许把这次同步结果固化进安卓仓库。
        if: steps.gate.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(jq -r '.apps."lmt-layout".versionName' lmt-cards/update.json)
          # API 偶发波动不应该判定为产物不一致：重试几次拿到资产清单再比对。
          for i in 1 2 3; do
            if gh release view "apk-v$VERSION" --repo yejiawei19991118/lmt-cards --json assets > /tmp/lmt-assets.json; then break; fi
            echo "第 $i 次读取 Release 资产失败，稍后重试"
            sleep 10
          done
          test -s /tmp/lmt-assets.json || { echo "::error::无法读取 apk-v$VERSION 的 Release 资产清单"; exit 1; }
          for app in lmt-layout lmt-cardgen; do
            want_size=$(jq -r ".apps.\"$app\".size" lmt-cards/update.json)
            want_sha=$(jq -r ".apps.\"$app\".sha256" lmt-cards/update.json)
            mirror="lmt-cards/docs/apk/$app-release.apk"
            got_size=$(stat -c%s "$mirror")
            got_sha=$(sha256sum "$mirror" | cut -d' ' -f1)
            name=$(grep -E "^$app\.versionName=" android/version.properties | cut -d= -f2 | tr -d '\r')
            [ "$want_size" = "$got_size" ] || { echo "::error::$app 镜像大小与登记值不符：登记 $want_size，实际 $got_size"; exit 1; }
            [ "$want_sha" = "$got_sha" ] || { echo "::error::$app 镜像 sha256 与登记值不符：登记 $want_sha，实际 $got_sha"; exit 1; }
            [ "$name" = "$VERSION" ] || { echo "::error::$app version.properties 版本名与清单不符：$name ≠ $VERSION"; exit 1; }
            asset_size=$(jq -r --arg n "$app-release.apk" '.assets[] | select(.name == $n) | .size' /tmp/lmt-assets.json)
            [ -n "$asset_size" ] && [ "$asset_size" != "null" ] || { echo "::error::Release apk-v$VERSION 缺少资产 $app-release.apk"; exit 1; }
            [ "$asset_size" = "$want_size" ] || { echo "::error::$app Release 资产与登记值不同字节：资产 $asset_size，登记 $want_size"; exit 1; }
            echo "$app 复核通过：$got_size 字节 / $got_sha"
          done
          # 主源与 Pages 承载的两份清单必须逐字一致，否则会按访问路径给出不同版本号。
          diff -q lmt-cards/update.json lmt-cards/docs/update.json
          echo "产物复核全部通过（清单 / 镜像 / Release 资产 / version.properties 一致）"

      - name: 提交并推送安卓副本
        if: steps.gate.outputs.changed == 'true'
        run: |
          set -euo pipefail
          cd android
          # 用 SSH 形式的远端，确保走的是部署密钥而不是 HTTPS 凭据
          git remote set-url origin git@github.com:yejiawei19991118/lmt-android.git
          git config user.email 'lmt-release-bot@users.noreply.github.com'
          git config user.name 'lmt-release-bot'
          # version.properties 由 release.ps1 回写（与 update.json 同步），必须一并提交，
          # 否则本机/离线构建仍会回退读到旧版本号而装不上。
          git add lmt-layout/src/main/assets/index.html lmt-cardgen/src/main/assets/index.html lmt-cards-sync.json version.properties
          git commit -m "chore(sync): 从 lmt-cards ${GITHUB_SHA:0:8} 同步共享核心"
          # 与 release.ps1 一致先 rebase 再推：安卓副本可能被别的提交/机器改动过，直接 push 会非快进被拒。
          git pull --rebase --autostash
          git push origin HEAD:main

      - name: 提交并推送 SW 缓存版本（仅 PWA 专属外壳变化时）
        # 只改了 PWA 外壳时不发版，但 sw.js 的升版必须落地，否则用户长期停在旧界面。
        # 提交信息以 chore(release): 开头，使下一次运行命中 job 级 if 而被整体跳过（本步骤自己推送的提交）。
        if: steps.gate.outputs.changed == 'false' && steps.gate.outputs.docs_changed == 'true'
        working-directory: lmt-cards
        run: |
          set -euo pipefail
          git config user.email 'lmt-release-bot@users.noreply.github.com'
          git config user.name 'lmt-release-bot'
          git add docs
          git commit -m "chore(release): 升 SW 缓存版本（PWA 专属外壳变更，不进安卓副本）"
          git pull --rebase --autostash
          git push origin main

      - name: 未变化时的说明
        if: steps.gate.outputs.changed == 'false' && steps.gate.outputs.docs_changed != 'true'
        run: echo "本次无需同步与发版：安卓副本与 PWA 共享核心本来就一致，SW 缓存版本也无需升版。"
