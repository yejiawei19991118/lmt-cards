<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LMT 工具箱</title>
<meta name="theme-color" content="#2f6df6">
<style>
  :root { --accent:#2f6df6; --page-bg:#eef1f6; --text-main:#1f2430; --text-sub:#5b6472; }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; padding:44px 20px;
    background:var(--page-bg); color:var(--text-main);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft YaHei", Arial, sans-serif;
    -webkit-text-size-adjust:100%; text-size-adjust:100%;
  }
  .wrap { max-width:560px; margin:0 auto; }
  h1 { font-size:22px; margin:0 0 6px; letter-spacing:.5px; }
  .sub { font-size:13.5px; color:var(--text-sub); margin:0 0 26px; line-height:1.7; }
  a.app {
    display:flex; align-items:center; gap:14px; text-decoration:none; color:inherit;
    background:#fff; border:1px solid #e8ecf3; border-radius:16px; padding:18px;
    box-shadow:0 8px 24px rgba(24,33,51,.08); margin-bottom:14px;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  a.app:active { transform:scale(.985); }
  a.app img { width:52px; height:52px; border-radius:13px; display:block; flex:0 0 auto; }
  .txt { min-width:0; }
  .t { display:block; font-size:15.5px; font-weight:600; }
  .d { display:block; font-size:12.5px; color:var(--text-sub); margin-top:3px; }
  .arrow { margin-left:auto; color:var(--accent); font-size:20px; line-height:1; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>LMT 工具箱</h1>
    <p class="sub">iPhone / iPad 请用 <strong>Safari</strong> 打开下方应用，点「分享」→「添加到主屏幕」，即可像 App 一样全屏运行。</p>

    <a class="app" href="./lmt-layout/">
      <img src="./lmt-layout/icon-192.png" alt="">
      <span class="txt">
        <span class="t">图文排版生成器</span>
        <span class="d">图文 / 字幕排版，支持导出图片</span>
      </span>
      <span class="arrow">&#8250;</span>
    </a>

    <a class="app" href="./lmt-cardgen/">
      <img src="./lmt-cardgen/icon-192.png" alt="">
      <span class="txt">
        <span class="t">卡密生成器</span>
        <span class="d">卡密生成与在线清单同步</span>
      </span>
      <span class="arrow">&#8250;</span>
    </a>
  </div>
</body>
</html>
